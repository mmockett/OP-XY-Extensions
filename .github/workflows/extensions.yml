name: Extension checks
# Checks every extension here against the Open-XY SDK it targets: its record and
# sources, its own host tests, and a firmware compile with the pinned Blackfin
# tools beside the SDK's probe synth. No stock files or device.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # The SDK with the drumline_page capability: etcetc000/open-xy#411's branch until
  # it merges, then staging.
  OPEN_XY_REPOSITORY: mmockett/open-xy
  OPEN_XY_REF: drum/drumline-page2
jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: extensions
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPOSITORY }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host test tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Extension checks
        shell: bash
        run: |
          args=()
          for record in extensions/*/extension.json; do args+=(--extension "$(dirname "$record")"); done
          python open-xy/sdk.py test "${args[@]}" --cxx clang++ --host-cxx g++
  firmware:
    # The pinned Blackfin tools run on Windows x86_64 and macOS arm64.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: extensions
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPOSITORY }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Blackfin tools
        run: python open-xy/sdk.py toolchain fetch
      - name: Firmware compile with every extension here
        shell: bash
        run: |
          # A build needs a machine; the SDK's probe synth stands in.
          args=(--machine open-xy/tests/fixtures/machines/probesynth)
          for record in extensions/*/extension.json; do args+=(--extension "$(dirname "$record")"); done
          python open-xy/sdk.py compile "${args[@]}" --out "$RUNNER_TEMP/module"
